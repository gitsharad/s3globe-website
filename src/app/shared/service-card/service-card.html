<a
  [routerLink]="['/services']"
  [fragment]="service().anchor"
  class="reveal glass group flex h-full flex-col rounded-2xl p-7 transition-all duration-300 hover:-translate-y-1.5 hover:border-brand-cyan/40 hover:shadow-glow"
>
  <div class="grid h-12 w-12 place-items-center rounded-xl bg-gradient-to-br from-brand-blue/20 to-brand-cyan/20 text-brand-cyan transition-colors group-hover:from-brand-blue group-hover:to-brand-cyan group-hover:text-white">
    <app-icon [name]="service().icon" class="h-6 w-6" />
  </div>
  <h3 class="mt-5 text-lg font-bold text-heading">{{ service().title }}</h3>
  <p class="mt-2.5 text-sm leading-relaxed text-muted">{{ service().description }}</p>
  <ul class="mt-5 flex flex-wrap gap-2">
    @for (point of service().points; track point) {
      <li class="rounded-full border border-subtle px-2.5 py-1 text-xs text-faint">{{ point }}</li>
    }
  </ul>
  <span class="mt-6 inline-flex items-center gap-1.5 text-sm font-semibold text-brand-cyan">
    Learn more
    <app-icon name="arrow-right" class="h-4 w-4 transition-transform group-hover:translate-x-1" />
  </span>
</a>
