<div class="flex items-center gap-2.5">
  <svg viewBox="0 0 48 48" fill="none" [class]="iconClass() + ' shrink-0'">
    <circle cx="24" cy="24" r="15" fill="#2563eb" />
    <ellipse cx="24" cy="24" rx="15" ry="6" fill="none" stroke="#bfdbfe" stroke-width="1.2" opacity="0.85" />
    <ellipse cx="24" cy="24" rx="6.5" ry="15" fill="none" stroke="#bfdbfe" stroke-width="1.2" opacity="0.85" />
    <line x1="9" y1="24" x2="39" y2="24" stroke="#bfdbfe" stroke-width="1.2" opacity="0.85" />
    <line x1="24" y1="9" x2="24" y2="39" stroke="#bfdbfe" stroke-width="1.2" opacity="0.85" />
    <path d="M9 29 C 17 36, 33 33, 39 13" stroke="#0b1224" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <path d="M32 9 L 41 13 L 35 20" stroke="#0b1224" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" fill="none" />
  </svg>

  <div class="flex flex-col leading-none">
    <span class="flex items-baseline font-extrabold tracking-tight" [class]="wordmarkClass()">
      <span class="text-brand-blue">S3</span><span class="text-heading">GLOBE</span>
    </span>
    <span class="mt-1 text-[9px] font-semibold uppercase tracking-[0.22em] text-muted sm:text-[10px]">
      Web Solution
    </span>
    @if (showTagline()) {
      <span class="mt-1.5 text-[10px] font-medium uppercase tracking-[0.15em] text-brand-cyan">
        Solutions Serve Success
      </span>
    }
  </div>
</div>
