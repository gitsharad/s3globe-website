<div class="reveal max-w-2xl" [class.mx-auto]="center()" [class.text-center]="center()">
  @if (eyebrow()) {
    <span class="inline-flex items-center gap-2 rounded-full border border-brand-cyan/30 bg-brand-cyan/5 px-4 py-1.5 text-xs font-semibold uppercase tracking-widest text-brand-cyan">
      {{ eyebrow() }}
    </span>
  }
  <h2 class="mt-4 text-3xl font-extrabold tracking-tight text-heading sm:text-4xl lg:text-[2.75rem]">
    {{ title() }}
  </h2>
  @if (subtitle()) {
    <p class="mt-4 text-base leading-relaxed text-muted sm:text-lg">{{ subtitle() }}</p>
  }
</div>
