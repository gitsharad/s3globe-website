<div class="hidden border-b border-subtle bg-navy-950 lg:block">
  <div class="container-px mx-auto flex max-w-7xl items-center justify-between py-2.5 text-xs">
    <div class="flex items-center gap-6 text-muted">
      <a [href]="'tel:' + site.phone" class="flex items-center gap-1.5 transition-colors hover:text-brand-cyan">
        <app-icon name="phone" class="h-3.5 w-3.5" />
        {{ site.phone }}
      </a>
      <a [href]="'mailto:' + site.email" class="flex items-center gap-1.5 transition-colors hover:text-brand-cyan">
        <app-icon name="mail" class="h-3.5 w-3.5" />
        {{ site.email }}
      </a>
      <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 transition-colors hover:text-brand-cyan">
        <app-icon name="message-circle" class="h-3.5 w-3.5" />
        WhatsApp Us
      </a>
    </div>
